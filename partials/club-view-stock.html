<div class="club-view-stage sc-stock-layout">
<section class="card-section sc-stock-main" aria-labelledby="stock-manual-title">
  <div class="member-csv-toolbar sc-toolbar-compact sc-stock-head">
    <h2 id="stock-manual-title">Contaje</h2>
    <div class="member-csv-toolbar__actions sc-stock-head__actions">
      <p id="stock-shift-banner" class="hint stock-shift-banner status-pill sc-stock-head__shift" role="status">
        Comprobando turno…
      </p>
      <label class="visually-hidden" for="stk-sort-by">Orden</label>
      <select class="select sc-stock-head__sort" id="stk-sort-by" aria-label="Orden">
        <option value="category" selected>Categoría</option>
        <option value="name_asc">Nombre (A-Z)</option>
        <option value="name_desc">Nombre (Z-A)</option>
        <option value="stock_asc">Stock ↑</option>
        <option value="stock_desc">Stock ↓</option>
      </select>
    </div>
  </div>

  <select class="select sc-stock-toolbar__cat-select" id="stk-filter-category" aria-label="Categoría" hidden>
    <option value="">Todas</option>
  </select>
  <div id="stk-cat-chips" class="chip-row sc-chip-row-compact sc-stock-chips" role="group" aria-label="Categorías"></div>

  <p class="hint sc-hint-collapsed sc-stock-hint">
    Con <strong>bote</strong>: peso total en báscula (se resta tara). Sin bote: stock neto directo.
  </p>

  <div class="table-wrap sc-table-fill sc-stock-table-wrap">
    <table class="table-compact" id="stock-manual-table">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Stock</th>
          <th>Nuevo (g)</th>
          <th>Descuadre</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="stock-manual-tbody"></tbody>
    </table>
  </div>
  <p id="stock-status" class="msg" role="status" aria-live="polite"></p>
</section>
</div>
